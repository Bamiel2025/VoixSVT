[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "correcteur-auto-svt"
version = "0.1.0"
description = "Correction locale et décisionnelle de réponses audio SVT pour les cycles 3 et 4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
whisper-win = [
  "faster-whisper>=1.1,<2; sys_platform == 'win32'",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]
[project.scripts]
correcteur-auto = "app.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false


